minimum_prek_version = "0.3.0"

# Everything under a tests/runs/ directory is byte-frozen evidence: the run
# manifests record artifact SHA-256s, and scripts/measured-descriptions.toml
# anchors exact quotes in the run records themselves, so a formatting hook that
# rewrites any of it breaks the recorded provenance chain. The three
# byte-mutating hooks below carry the same exclude regex for that reason.
# scripts/check-citations.py owns the definition of what is frozen; its
# FROZEN_DIRS matches a tests/runs pair of path segments at any depth, under
# any top-level directory, so the `(.*/)?tests/runs/` alternative below mirrors
# it rather than naming skills/ (`.agents/skills/*/tests/runs/` holds run
# records too). Keep the two in sync: nothing fails if they drift.
# Manifest-pinned fixtures are excluded on the same grounds.
# Shared-section goldens are also byte-frozen (exact extracts from SKILL.md
# sections), so they are excluded from the same three hooks.

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = '^((.*/)?tests/runs/.*|skills/exploratory-data-analysis/tests/eval/canary-fixture-2026-08-11\.json|scripts/shared-sections/.*)$' },
  { id = "end-of-file-fixer", exclude = '^((.*/)?tests/runs/.*|skills/exploratory-data-analysis/tests/eval/canary-fixture-2026-08-11\.json|scripts/shared-sections/.*)$' },
  { id = "mixed-line-ending", exclude = '^((.*/)?tests/runs/.*|skills/exploratory-data-analysis/tests/eval/canary-fixture-2026-08-11\.json|scripts/shared-sections/.*)$' },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-skill-frontmatter", name = "Validate SKILL.md frontmatter against agentskills.io spec", language = "python", language_version = "python3", additional_dependencies = ["pyyaml>=6"], entry = "python scripts/check-skill-frontmatter.py", files = "(?:^|/)SKILL\\.md$", pass_filenames = true },
  { id = "check-citations", name = "skills: cross-file citations resolve and attributed quotes are accurate", language = "python", language_version = "python3", entry = "python scripts/check-citations.py", files = "^skills/(hypothesis-driven-analysis|exploratory-data-analysis|causal-identification-review|decision-analysis)/(SKILL\\.md|references/.*\\.md|decisions/.*\\.md|tests/scenarios\\.md)$", pass_filenames = false },
  # Two mechanisms, one hook. decisions/001-shared-gate-authority.md (EDA)
  # enumerates the invariants the costly-collection and data-rules copies must
  # preserve; rewording was guarded only by a hand check nothing ran, so each
  # copy is frozen against a golden and refreshing one (--update) is a
  # diff-visible act the decision record governs. The authorization gate is
  # byte-identical everywhere, so it is rendered from one authority file
  # instead: this hook fails when a carrier's rendered copy drifts from
  # scripts/shared-sections/authorization-gate.md or stops being visible to a
  # reader. It watches HDA's SKILL.md too, which is why the three per-skill
  # gate-parity hooks it replaced are gone.
  { id = "check-shared-sections", name = "skills: the rendered gate matches its authority; the reworded copies match their goldens", language = "python", language_version = "python3", entry = "python scripts/check-shared-sections.py", files = "^(skills/(hypothesis-driven-analysis|exploratory-data-analysis|causal-identification-review|decision-analysis)/SKILL\\.md|scripts/(check-shared-sections\\.py|shared-sections/.*))$", pass_filenames = false },
  # The suite reads the four SKILL.md files and the authority, so it watches
  # them: a gate edit must re-run the checker's own tests, not just the checker.
  { id = "shared-sections-tests", name = "skills: the shared-section checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q scripts/test_check_shared_sections.py", files = "^(scripts/(check-shared-sections\\.py|test_check_shared_sections\\.py|shared-sections/.*)|skills/(hypothesis-driven-analysis|exploratory-data-analysis|causal-identification-review|decision-analysis)/SKILL\\.md)$", pass_filenames = false },
  # skills/exploratory-data-analysis/decisions/006-description-freeze-until-measured.md:
  # the routing descriptions are pinned against unmeasured change. Goldens in
  # scripts/frontmatter-descriptions/; the decision record governs any refresh.
  { id = "check-description-freeze", name = "skills: frontmatter descriptions are frozen against unmeasured change", language = "python", language_version = "python3", additional_dependencies = ["pyyaml>=6"], entry = "python scripts/check-description-freeze.py", files = "^(skills/(hypothesis-driven-analysis|exploratory-data-analysis|causal-identification-review|decision-analysis)/SKILL\\.md|scripts/(check-description-freeze\\.py|frontmatter-descriptions/.*))$", pass_filenames = false },
  { id = "description-freeze-tests", name = "skills: the description-freeze checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8", "pyyaml>=6"], entry = "python -m pytest -q scripts/test_check_description_freeze.py", files = "^scripts/(check-description-freeze\\.py|test_check_description_freeze\\.py)$", pass_filenames = false },
  { id = "citations-tests", name = "skills: the citation checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q scripts/test_check_citations.py", files = "^scripts/(check-citations\\.py|test_check_citations\\.py)$", pass_filenames = false },
  # skills/exploratory-data-analysis/decisions/007-measurement-claim-binding.md
  # owns the convention this hook enforces. Frozen run records are inputs
  # (registry anchors live in them), so the files regex watches tests/runs too;
  # pass_filenames is false, so widening the regex adds no per-file skip noise.
  { id = "check-measurement-claims", name = "skills: description-measurement claims are bound to verified evidence", language = "python", language_version = "python3", additional_dependencies = ["pyyaml>=6"], entry = "python scripts/check-measurement-claims.py", files = "^(skills/(hypothesis-driven-analysis|exploratory-data-analysis|causal-identification-review|decision-analysis)/(SKILL\\.md|references/.*\\.md|decisions/.*\\.md|tests/scenarios\\.md|tests/runs/.*|tests/eval/frozen-.*\\.txt)|scripts/(check-measurement-claims\\.py|measured-descriptions\\.toml|frontmatter-descriptions/.*))$", pass_filenames = false },
  { id = "measurement-claims-tests", name = "skills: the measurement-claim checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8", "pyyaml>=6"], entry = "python -m pytest -q scripts/test_check_measurement_claims.py", files = "^scripts/(check-measurement-claims\\.py|test_check_measurement_claims\\.py|check-citations\\.py|check-description-freeze\\.py|measured-descriptions\\.toml)$", pass_filenames = false },
  { id = "frontmatter-tests", name = "skills: the frontmatter checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8", "pyyaml>=6"], entry = "python -m pytest -q scripts/test_check_skill_frontmatter.py", files = "^scripts/(check-skill-frontmatter\\.py|test_check_skill_frontmatter\\.py)$", pass_filenames = false },
  # The instruments' own unit suite. Nothing ran it before, so an edit to
  # score_ledger.py landed unchecked. The whole tests tree is collected; the
  # deliberately-broken scenario-3 fixture is held out by
  # skills/hypothesis-driven-analysis/tests/conftest.py, which travels with the
  # directory and so is honored whatever cwd pytest is invoked from.
  { id = "hda-instrument-tests", name = "hypothesis-driven-analysis: the ledger instruments' own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q skills/hypothesis-driven-analysis/tests", files = "^skills/hypothesis-driven-analysis/(tests/.*\\.py|references/ledger-template\\.md)$", pass_filenames = false },
  { id = "validate-s15-fixture", name = "hypothesis-driven-analysis: s15 fixture keeps every trap it sets", language = "python", language_version = "python3", entry = "python skills/hypothesis-driven-analysis/tests/fixtures/validate_s15.py skills/hypothesis-driven-analysis/tests/fixtures/s15-assist-rollout", files = "^skills/hypothesis-driven-analysis/tests/fixtures/(generate\\.py|validate_s15\\.py|s15-assist-rollout/)", pass_filenames = false },
  { id = "validate-s21-fixture", name = "hypothesis-driven-analysis: s21 packets keep every property they set", language = "python", language_version = "python3", entry = "python skills/hypothesis-driven-analysis/tests/fixtures/validate_s21.py skills/hypothesis-driven-analysis/tests/fixtures/s21-status-disposition", files = "^skills/hypothesis-driven-analysis/tests/fixtures/(generate\\.py|validate_s21\\.py|s21-status-disposition/)", pass_filenames = false },
  # s5b-seam has its own generator and validator rather than joining generate.py:
  # that file drives every legacy fixture from one module-level RNG in a fixed
  # call order, so a fixture drawing from it inherits a dependency on every
  # builder ahead of it. This validator also regenerates and byte-compares
  # (trap 8), which the older fixture hooks do not do.
  { id = "validate-s5b-seam-fixture", name = "hypothesis-driven-analysis: s5b-seam fixture keeps every trap it sets", language = "python", language_version = "python3", entry = "python skills/hypothesis-driven-analysis/tests/fixtures/validate_s5b_seam.py skills/hypothesis-driven-analysis/tests/fixtures/s5b-seam", files = "^skills/hypothesis-driven-analysis/tests/fixtures/(generate_s5b_seam\\.py|validate_s5b_seam\\.py|s5b-seam/)", pass_filenames = false },
  # causal-identification-review's four fixtures (CS3, CS4, CS5, CS7) share one
  # generate.py, each builder owning its own local RNG rather than reading a
  # module-level stream in call order -- unlike the hypothesis-driven-analysis
  # legacy generate.py this deliberately does not follow. Because the builders
  # share the module, every hook below watches generate.py too: an edit there
  # can move any fixture's bytes, not just the one its own builder targets.
  # Each validator regenerates into a tempdir and byte-compares (and, for CS3
  # and CS5, reimplements a "generator computes and records" numeric check --
  # pre-trend slope, Lee bounds -- independently rather than importing it).
  { id = "validate-cs3-fixture", name = "causal-identification-review: cs3-rollout fixture keeps every trap it sets", language = "python", language_version = "python3", entry = "python skills/causal-identification-review/tests/fixtures/validate_cs3.py skills/causal-identification-review/tests/fixtures/cs3-rollout", files = "^skills/causal-identification-review/tests/fixtures/(generate\\.py|validate_cs3\\.py|cs3-rollout-ground-truth\\.md|cs3-rollout/)", pass_filenames = false },
  { id = "validate-cs4-fixture", name = "causal-identification-review: cs4-facts fixture keeps every fact it states", language = "python", language_version = "python3", entry = "python skills/causal-identification-review/tests/fixtures/validate_cs4.py skills/causal-identification-review/tests/fixtures/cs4-facts", files = "^skills/causal-identification-review/tests/fixtures/(generate\\.py|validate_cs4\\.py|cs4-facts/)", pass_filenames = false },
  { id = "validate-cs5-fixture", name = "causal-identification-review: cs5-bounds fixture keeps every trap it sets", language = "python", language_version = "python3", entry = "python skills/causal-identification-review/tests/fixtures/validate_cs5.py skills/causal-identification-review/tests/fixtures/cs5-bounds", files = "^skills/causal-identification-review/tests/fixtures/(generate\\.py|validate_cs5\\.py|cs5-bounds-ground-truth\\.md|cs5-bounds/)", pass_filenames = false },
  { id = "validate-cs7-fixture", name = "causal-identification-review: cs7-seam fixture keeps every trap it sets", language = "python", language_version = "python3", entry = "python skills/causal-identification-review/tests/fixtures/validate_cs7.py skills/causal-identification-review/tests/fixtures/cs7-seam", files = "^skills/causal-identification-review/tests/fixtures/(generate\\.py|validate_cs7\\.py|cs7-seam-ground-truth\\.md|cs7-seam/)", pass_filenames = false },
  # The record checker's own unit suite (check_review.py + test_check_review.py),
  # mirroring hda-instrument-tests. The suite includes test_template_parity_cir.py,
  # which keeps the record template's slot labels byte-identical to the checker's,
  # so the files regex also watches the template: renaming a slot there must fail
  # here, not silently orphan the checker's labels. The regex otherwise matches
  # only .py files directly under tests/ (not tests/fixtures/), so an edit under
  # fixtures/ does not redundantly re-trigger this hook on top of its own
  # validate-cs*-fixture hooks above; pytest still collects the whole tests/
  # tree, but fixtures/generate.py and validate_*.py are not named test_*.py, so
  # default collection skips them.
  { id = "cir-instrument-tests", name = "causal-identification-review: the record checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q skills/causal-identification-review/tests", files = "^skills/causal-identification-review/(SKILL\\.md|tests/[^/]+\\.py|references/identification-review-template\\.md)$", pass_filenames = false },
  { id = "da-instrument-tests", name = "decision-analysis: the record checker's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q skills/decision-analysis/tests", files = "^skills/decision-analysis/(SKILL\\.md|tests/[^/]+\\.py|references/decision-record-template\\.md)$", pass_filenames = false },
  # instruments/ is the public, fixture-neutral structural validator adopted in
  # principle by HDA decisions/006 (which owns its scope). Its parity test
  # reads all four record templates and its template-clean test feeds their
  # fenced blocks through check(), so the files regex watches the templates
  # too: a template change must fail here, not silently orphan the validator.
  { id = "instruments-tests", name = "instruments: the structural record validator's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q instruments", files = "^(instruments/.*\\.py|hooks/(hooks\\.json|check_record_hook\\.py|check_record_hook\\.sh)|\\.claude-plugin/plugin\\.json|skills/[^/]+/references/(ledger-template|exploration-log-template|identification-review-template|decision-record-template)\\.md)$", pass_filenames = false },
  { id = "release-tree-tests", name = "scripts: the release-tree builder's own unit suite passes", language = "python", language_version = "python3", additional_dependencies = ["pytest>=8"], entry = "python -m pytest -q scripts/test_build_release_tree.py", files = "^(scripts/(build-release-tree|test_build_release_tree)\\.py|hooks/.*|\\.claude-plugin/.*|\\.codex-plugin/.*|\\.agents/.*|instruments/check_record\\.py|output-styles/.*|skills/[^/]+/SKILL\\.md|LICENSE)$", pass_filenames = false },
]
